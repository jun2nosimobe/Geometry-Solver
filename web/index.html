<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作図と定理発見</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="tools">
    <h1>作図</h1>
    <div class="group" id="toolbar"></div>
    <div class="group">
      <button class="util" data-act="undo" title="Ctrl+Z">元に戻す</button>
      <button class="util" data-act="clear">全部消す</button>
    </div>
    <p class="hint" id="hint">点ツールで自由点を置いてください。</p>
  </aside>

  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="statusbar"><span id="coords"></span></div>
  </main>

  <div id="splitter" role="separator" aria-orientation="vertical"
       title="ドラッグして幅を変える（ダブルクリックで既定に戻す）"></div>

  <aside id="side">
    <section>
      <div class="sechead">
        <h2>定理発見</h2>
        <span class="headbtns">
          <button id="stop" class="util" hidden title="探索と証明を打ち切ります">中止</button>
          <button id="discover">調べる</button>
        </span>
      </div>
      <p class="note">描いた位置ではなく<strong>作図の手順そのもの</strong>から、常に成り立つ関係だけを探します。自由点をどこへ動かしても成り立つものだけが出ます。</p>
      <label class="field">
        <span>探し方</span>
        <select id="rounds">
          <option value="0">描いた図のまま調べる</option>
          <option value="1">自由作図 1段</option>
          <option value="2">自由作図 2段</option>
          <option value="3" selected>自由作図 3段</option>
          <option value="4">自由作図 4段</option>
        </select>
      </label>
      <details id="advanced">
        <summary><span class="twisty" aria-hidden="true"></span>細かい設定</summary>
        <label class="field"><span>時間の上限 (秒)</span><input id="seconds" type="number" min="1" max="600" value="20"></label>
        <label class="field"><span>作図の実体数の上限</span><input id="cap" type="number" min="20" max="4000" step="20" value="400"></label>
        <label class="field"><span>1段あたりの材料数</span><input id="per_kind" type="number" min="3" max="20" value="8"></label>
        <label class="field"><span>調べる図形の数</span><input id="sweep" type="number" min="8" max="200" value="64"></label>
        <label class="field"><span>報告する件数</span><input id="top" type="number" min="1" max="200" value="30"></label>
        <label class="field"><span>証明に使う時間 (秒/件)</span><input id="prove_seconds" type="number" min="1" max="120" value="5"></label>
        <label class="field"><span>証明を試す件数</span><input id="prove_max" type="number" min="1" max="100" value="20"></label>
        <p class="note">自由作図の段数・実体数・調べる図形の数を上げるほど深い関係に届きますが、時間は急に増えます。時間の上限に達したところで打ち切ります。</p>
      </details>
      <p class="note" id="stagenote" hidden></p>

      <div id="auxbar" hidden>
        <span id="auxcount"></span>
        <button id="adopt" class="util">図に取り込む</button>
        <button id="dropaux" class="util">消す</button>
      </div>
      <div id="resulthead" hidden>
        <div class="sechead">
          <h2>見つかった性質 <span id="count"></span></h2>
          <button id="proveall" class="util" title="今の図(補助作図も含む)で、どれが今の定理集合からすぐ出るかを確かめます">証明を試す</button>
        </div>
        <div class="filters">
          <label class="filterbox"><input id="onlymine" type="checkbox">自分の図に関わるものだけ</label>
          <label class="filterbox"><input id="hideproved" type="checkbox">証明できたものを隠す</label>
          <label class="filterbox">並べ替え
            <select id="sortby" title="どの指標で面白い順にするか">
              <option value="score">面白さ</option>
              <option value="degree">次数</option>
              <option value="heat">熱</option>
              <option value="degen">退化の関係</option>
              <option value="mine">自分の図</option>
            </select>
          </label>
        </div>
        <p class="note" id="sortnote"></p>
      </div>
      <div id="findings" class="empty">まだ調べていません。</div>
    </section>
    <details id="scriptbox">
      <summary><span class="twisty" aria-hidden="true"></span>作図手順<span class="spacer"></span><button id="copy" class="util">コピー</button></summary>
      <pre id="script"></pre>
    </details>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
